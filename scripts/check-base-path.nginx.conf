# The proxy in front of scripts/check-base-path.mjs. It publishes one prefix and
# refuses everything else, logging each refusal, so a request that escapes the
# prefix is a line in outside.log as well as a failure in the browser.
#
# @PORT@, @PREFIX@ and @BACKEND@ are filled in by scripts/check-base-path.sh.
events {}

http {
    log_format check '$request_method $request_uri $status';
    access_log /var/log/nginx/inside.log check;

    server {
        listen @PORT@ ssl;
        ssl_certificate     /etc/nginx/check/cert.pem;
        ssl_certificate_key /etc/nginx/check/key.pem;

        client_max_body_size 32m;

        location = @PREFIX@ {
            proxy_pass http://@BACKEND@;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @PREFIX@/ {
            proxy_pass http://@BACKEND@;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        location / {
            access_log /var/log/nginx/outside.log check;
            return 404;
        }
    }
}
