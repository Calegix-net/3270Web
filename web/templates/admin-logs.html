<!DOCTYPE html>
<html lang="en"><head>{{template "base-path"}}<title>3270Web — Logs</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{{basePath}}/static/style.css?v=22"><link rel="stylesheet" href="{{basePath}}/static/ui-polish.css?v=20"><link rel="stylesheet" href="{{basePath}}/static/auth.css?v=8"><script src="{{basePath}}/static/theme.js?v=10" defer></script><script src="{{basePath}}/static/admin-logs.js?v=1" defer></script></head>
<body><script src="{{basePath}}/static/early-theme-init.js"></script><main class="admin-page admin-page--wide"><div class="card"><div class="card-header"><h1>Logs</h1><a class="button-link" href="{{basePath}}/">Back to 3270Web</a></div>{{ template "admin-nav" "logs" }}
{{ if .Enabled }}<div class="toolbar"><button type="button" data-admin-logs-refresh>Refresh</button><a class="button-link" href="{{basePath}}/logs/download">Download logs</a></div><p class="admin-status" data-admin-logs-status role="status"></p><pre class="admin-log-content" data-admin-logs-content style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto"></pre>
{{ else }}<p class="auth-alert auth-alert--info">Log access is disabled. An administrator can enable Allow log access in Settings.</p>{{ end }}</div></main></body></html>
