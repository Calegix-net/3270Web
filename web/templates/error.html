<!DOCTYPE html>
<html lang="en">
<head>
    {{template "base-path"}}
    <title>3270Web - Error</title>
    <!-- Without this, mobile browsers lay the page out at a ~980px virtual
         viewport and scale it down: the desktop layout is rendered in
         miniature and every max-width media query below is dead, because
         the viewport reports 980px on a 412px phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="3270Web could not complete the request.">
    <meta name="theme-color" content="#03110d">
    <meta name="color-scheme" content="dark light">
    <!-- An error page has nothing worth indexing, and the message it carries
         can name a host or a workflow file. -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="{{basePath}}/static/favicon-32.png">
    <link rel="apple-touch-icon" href="{{basePath}}/static/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="{{basePath}}/static/style.css?v=22">
    <link rel="stylesheet" href="{{basePath}}/static/ui-polish.css?v=20">
    <script src="{{basePath}}/static/theme.js?v=10" defer></script>
    <link rel="stylesheet" href="{{basePath}}/static/activation.css?v=1">
</head>
<body>
    <script src="{{basePath}}/static/early-theme-init.js"></script>
    <div class="bg-overlay" data-bg-toggle title="Click to toggle background animation" role="button" tabindex="0" aria-pressed="true" aria-label="Toggle background animation">
        <canvas id="bg-canvas" aria-hidden="true"></canvas>
    </div>
    <!-- The message is the whole page; role=main is what a screen reader
         jumps to, and role=alert on the card below is what announces it. -->
    <div class="error-page" role="main">
        <div class="error-card" role="alert" aria-live="assertive">
            <h1 class="error-title">Something went wrong</h1>
            <p class="error-message">The operation could not be completed. Your session has not been disconnected.</p>
            <details><summary>Technical details</summary><p>{{ .Error }}</p></details>
            <div class="error-actions"><a class="button-link primary-action" href="{{basePath}}/screen">Return to terminal</a><a class="button-link" href="{{basePath}}/">Choose a connection</a></div>
        </div>
    </div>
    <script src="{{basePath}}/static/background.js?v=2" defer></script>
</body>
</html>
